{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="login">
  <div class="bar"></div>
  <div class="panel">
    <h1>Electro-Motor Services</h1>
    <p class="hint">Sistema de gestión del taller. Inicia sesión para continuar.</p>
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf() }}">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" required autocomplete="username" autofocus>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <div class="actions"><button class="btn" style="width:100%">Entrar</button></div>
    </form>
  </div>
</div>
{% endblock %}
